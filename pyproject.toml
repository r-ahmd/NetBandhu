[project]
name = "netbandhu"
version = "0.1.0"
description = "NetBandhu — the subscriber's side of an ISP call centre"
requires-python = ">=3.12,<3.14"

dependencies = [
    # the model layer and the graph
    "langchain==1.3.14",
    "langgraph>=1.2.10,<1.3",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    # providers: one interface, three keys
    "langchain-openrouter>=0.3",
    "langchain-google-genai>=4.3.2,<5",
    "langchain-groq>=1.1.3,<2",
    # retrieval, on disk
    "langchain-qdrant>=1.0",
    "langchain-text-splitters>=1.1",
    "qdrant-client[fastembed]>=1.15",
    # the rest
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.8",
    "python-dotenv>=1.1",
    "pyyaml>=6.0",
    "pypdf>=6.0",
    "langsmith",
    "langchain-openai>=1.6.0,<2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pyyaml>=6.0.4",
]
