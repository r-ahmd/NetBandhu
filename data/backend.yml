credits:
  # The ledger's seed: credits already applied before the desk existed. The
  # runtime ledger (.state/credits.jsonl) is appended to, never rewritten.
  # (subscriber, incident) is the idempotency key — SLA §3.5.
  - id: CR-1001
    subscriber: SUB-2077
    incident: INC-8801
    amount: 412
    clause: "SLA §3.2"
    approved_by: "billing supervisor"
    applied: "2026-06-05"
