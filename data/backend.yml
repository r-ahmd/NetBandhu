# NetBandhu's mock backend — the operator's own records.
#
# SHAPE (copied from the course's data/backend.yml, for the same reasons)
#   Five collections, each a mapping. The KEY is the stable identifier — the
#   thing a tool is handed and looks up — which is why entries here carry no
#   `id:` field.
#
#   Dates are QUOTED, every one of them. Unquoted, PyYAML returns a
#   datetime.date, and json.dumps then refuses to serialise it — which matters
#   because a tool's return value is serialised on its way to the model.
#
#   Nothing here is real: an invented operator, invented streets, invented
#   people, invented incidents.
#
# THE PLANTED EDGE CASES
#   INC-8809  downtime 3h50m — BELOW the §3.1 four-hour threshold. Must earn
#             nothing, and the answer must say so and say when it would qualify.
#   INC-8812  downtime 5h20m — the demo incident. ৳1200/24 × 5.333 = ৳267.
#   INC-8815  downtime 4h10m — just over the line, on the ৳1800 plan:
#             ৳1800/24 × 4.1667 = ৳313.
#   SUB-2077  has TWO incidents in one month, one credited already (INC-8801).
#             A second request for INC-8801 must be answered as already credited.
#   INV-88117 carries the ৳390 reconnection fee plus the ৳1200 plan = ৳1590.
#   SUB-2041  the demo subscriber: one credited incident, one live one.
#
#   Every subscriber's `phone` is a fake 01X number. Emails are @example.com.

plans:
  HOME-20:
    name: 20 Mbps Home
    speed_mbps: 20
    monthly_fee: 1200
  HOME-40:
    name: 40 Mbps Home
    speed_mbps: 40
